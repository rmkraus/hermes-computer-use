services:
  computer-use:
    build: .
    image: hermes-computer-use:latest
    container_name: hermes-computer-use
    ports:
      - "8002:8000"   # host 8002 → container 8000 (host 8000 reserved for vLLM)
    environment:
      - COMPUTER_USE_MODEL=${COMPUTER_USE_MODEL:-meta/llama-3.2-11b-vision-instruct}
      - COMPUTER_USE_PORT=8000
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - NIM_BASE_URL=${NIM_BASE_URL:-}
      - DISPLAY_NUM=99
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    shm_size: "256m"
    security_opt:
      - seccomp:unconfined   # required for Xvfb inside container
