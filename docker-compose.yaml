services:
  computer-use:
    build: .
    image: hermes-computer-use:latest
    container_name: hermes-computer-use
    ports:
      - "8002:8000"   # host 8002 → container 8000 (host 8000 used by vLLM)
    environment:
      - COMPUTER_USE_MODEL=${COMPUTER_USE_MODEL:-openai:gpt-4o}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-}
      - DISPLAY_NUM=99
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    shm_size: "256m"
    security_opt:
      - seccomp:unconfined   # required for Xvfb inside container
