# hermes-computer-use — NeMo Agent Toolkit workflow configuration
#
# Starts a react_agent with Ubuntu desktop automation tools and serves
# an OpenAI-compatible /v1/chat/completions endpoint on port 8000.
#
# Usage:
#   nat serve --config_file workflow.yaml
#
# Environment variables:
#   NVIDIA_API_KEY   — API key for NVIDIA NIM (build.nvidia.com)
#   OPENAI_API_KEY   — Alternative: use OpenAI as the LLM backend
#   LLM_BASE_URL     — Override LLM API base URL (e.g. local vLLM)
#   LLM_MODEL        — Override model name
#   DISPLAY          — X11 display to control (default :1)

functions:
  # ── Screenshot ──────────────────────────────────────────────────────────
  take_screenshot:
    _type: take_screenshot
    display: "${DISPLAY:-:1}"
    max_dimension: 1024

  # ── Mouse ────────────────────────────────────────────────────────────────
  mouse_move:
    _type: mouse_move

  mouse_click:
    _type: mouse_click

  mouse_double_click:
    _type: mouse_double_click

  mouse_scroll:
    _type: mouse_scroll

  # ── Keyboard ─────────────────────────────────────────────────────────────
  keyboard_type:
    _type: keyboard_type

  keyboard_key:
    _type: keyboard_key

  keyboard_hotkey:
    _type: keyboard_hotkey

  # ── Window management ────────────────────────────────────────────────────
  list_windows:
    _type: list_windows

  focus_window:
    _type: focus_window

  # ── Safety ───────────────────────────────────────────────────────────────
  check_action_safety:
    _type: check_action_safety

llms:
  # Primary: NVIDIA NIM (swap model_name for any NIM-hosted vision model)
  vision_llm:
    _type: nim
    model_name: "${LLM_MODEL:-meta/llama-4-scout-17b-16e-instruct}"
    temperature: 0.0
    max_tokens: 4096
    base_url: "${LLM_BASE_URL:-https://integrate.api.nvidia.com/v1}"

workflow:
  _type: react_agent
  llm_name: vision_llm
  tool_names:
    - take_screenshot
    - mouse_move
    - mouse_click
    - mouse_double_click
    - mouse_scroll
    - keyboard_type
    - keyboard_key
    - keyboard_hotkey
    - list_windows
    - focus_window
    - check_action_safety
  max_iterations: 20
  verbose: true
  parse_agent_response_max_retries: 3
  system_prompt: |
    You are a computer use agent that controls an Ubuntu desktop.
    You have access to tools to capture screenshots, move the mouse,
    click, type text, press keys, and manage windows.

    When given a task:
    1. ALWAYS start by taking a screenshot to see the current state of the desktop.
    2. Reason about what you see and what actions are needed.
    3. Execute actions one at a time — take a screenshot after significant actions
       to verify the result before proceeding.
    4. If you are unsure whether an action is safe, call check_action_safety first.
    5. If a step fails, take a screenshot to assess the new state and adapt.

    Key guidelines:
    - Use take_screenshot frequently — you cannot reason about the screen without it.
    - Prefer keyboard_hotkey for common operations (ctrl+c, ctrl+v, ctrl+z).
    - Use keyboard_key for navigation (Tab, Return, Escape, arrow keys).
    - Double-click to open files/applications; single-click for buttons/links.
    - When typing in a field, click it first to ensure focus.
    - Coordinates (x, y) are pixel positions from top-left (0, 0).

front_end:
  _type: fastapi
  host: "0.0.0.0"
  port: 8000
  workflow:
    method: POST
    openai_api_v1_path: "/v1/chat/completions"
    openai_api_path: "/v1/chat"
    legacy_path: "/generate"
  health:
    path: "/health"
