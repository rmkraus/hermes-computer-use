llms:
  agent:
    _type: nim
    model: ${COMPUTER_USE_MODEL:-meta/llama-3.2-11b-vision-instruct}
    api_key: ${NVIDIA_API_KEY}
    base_url: ${NIM_BASE_URL:-null}
    max_tokens: 4096

workflow:
  _type: langgraph_wrapper
  graph: src/hermes_computer_use/agent/agent.py:agent
  workflow_alias: computer_use

general:
  front_end:
    _type: fastapi
    workflow:
      method: POST
      description: "Ubuntu desktop automation agent"
      openai_api_v1_path: /v1/chat/completions
    host: ${COMPUTER_USE_HOST:-0.0.0.0}
    port: ${COMPUTER_USE_PORT:-8000}
